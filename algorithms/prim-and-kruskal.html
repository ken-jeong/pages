<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MST 시각화 — Kruskal & Prim</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --accent-p: #8A5D9F;
    --accent-mst: #2E7D5B;
    --edge-default: #B8B8B2;
    --edge-considering: #9A6A28;
    --edge-rejected: #B94A48;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    border-bottom: 1px solid var(--border);
    align-items: center;
    gap: 24px;
  }

  header h1 {
    letter-spacing: 0;
    color: var(--text);
  }

  header h1 span.k { color: var(--accent-k); }
  header h1 span.p { color: var(--accent-p); }

  .tab-bar {
    margin-left: auto;
  }

  .tab-btn {
    border: 1px solid var(--border);
    color: var(--text-muted);
    cursor: pointer;
  }

  .main {
    flex: 1;
    display: grid;
    width: min(1040px, 100%);
    margin: 0 auto;
    border-left: 1px solid var(--border);
    border-right: 1px solid var(--border);
  }

  .canvas-area {
    position: relative;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  svg#graph {
    border: 1px solid var(--border);
    width: 100%;
    height: 420px;
  }

  .controls {
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }

  .btn {
    border: 1px solid;
    cursor: pointer;
  }

  .btn-run-k { border-color: var(--accent-k); color: var(--accent-k); }
  .btn-run-k:hover { background: #F2F6FC; }
  .btn-run-p { border-color: var(--accent-p); color: var(--accent-p); }
  .btn-run-p:hover { background: #F6F3FA; }
  .btn-reset { border-color: var(--border); color: var(--text-muted); }
  .btn-reset:hover { border-color: var(--text-muted); color: var(--text); }
  .btn-step { border-color: var(--edge-considering); color: var(--edge-considering); }
  .btn-step:hover { background: #FAF6EF; }
  .btn-auto { border-color: var(--accent-mst); color: var(--accent-mst); }
  .btn-auto:hover { background: #F1FAF5; }

  .speed-ctrl {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 0.72rem;
    color: var(--text-muted);
    font-family: 'Space Mono', monospace;
  }

  input[type=range] {
    -webkit-appearance: none;
    width: 80px;
    height: 3px;
    background: var(--border);
    border-radius: 2px;
    outline: none;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 12px; height: 12px;
    border-radius: 50%;
    cursor: pointer;
  }

  .algo-badge {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    padding: 4px 12px;
  }
  .badge-k { background: #F2F6FC; color: var(--accent-k); border: 1px solid #BDCEE4; }
  .badge-p { background: #F6F3FA; color: var(--accent-p); border: 1px solid #D4C9DF; }

  .sidebar {
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }

  .sidebar-section {
    padding: 20px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-section h3 {
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    letter-spacing: 0.1em;
    color: var(--text-muted);
    margin-bottom: 12px;
    text-transform: uppercase;
  }

  #step-desc {
    font-size: 0.85rem;
    line-height: 1.6;
    color: var(--text);
    min-height: 60px;
  }

  .edge-list {
    display: flex;
    flex-direction: column;
    gap: 4px;
    max-height: 200px;
    overflow-y: auto;
  }

  .edge-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-radius: 4px;
    font-family: 'Space Mono', monospace;
    font-size: 0.72rem;
    background: var(--surface2);
    transition: all 0.3s;
  }

  .edge-item .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .edge-item.considering { background: #FAF6EF; border-left: 2px solid var(--edge-considering); }
  .edge-item.accepted { background: #F1FAF5; border-left: 2px solid var(--accent-mst); }
  .edge-item.rejected { background: #FFF5F4; border-left: 2px solid var(--edge-rejected); opacity: 0.7; }

  .stat-grid {
    display: grid;
    gap: 8px;
  }

  .stat-box {
    background: var(--surface2);
    padding: 12px;
    text-align: center;
  }

  .stat-box .val {
    font-family: 'Space Mono', monospace;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--accent-mst);
  }

  .stat-box .lbl {
    font-size: 0.68rem;
    color: var(--text-muted);
    margin-top: 2px;
  }

  /* legend */
  .legend {
    display: flex;
    flex-wrap: wrap;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.7rem;
    color: var(--text-muted);
    font-family: 'Space Mono', monospace;
  }

  .legend-line {
    width: 24px;
    height: 3px;
    border-radius: 2px;
  }

  /* scrollbar */
  ::-webkit-scrollbar { width: 5px; }
  ::-webkit-scrollbar-track { background: var(--surface); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .pq-list {
    display: flex;
    flex-direction: column;
    gap: 3px;
    max-height: 160px;
    overflow-y: auto;
  }

  .pq-item {
    display: flex;
    justify-content: space-between;
    padding: 5px 10px;
    background: var(--surface2);
    border-radius: 3px;
    font-family: 'Space Mono', monospace;
    font-size: 0.7rem;
    color: var(--text-muted);
  }

  .pq-item.top { color: var(--edge-considering); background: #FAF6EF; }

  @media (max-width: 820px) {
    header { flex-direction: column; align-items: stretch; }
    .tab-bar { margin-left: 0; }
    .main { border-left: none; border-right: none; }
    .sidebar { border-left: none; border-top: 1px solid var(--border); }
    svg#graph { height: 340px; }
  }
</style>
<link rel="stylesheet" href="../theme.css">
</head>
<body class="mst">

<header>
    <a class="home-link" href="../index.html"><span aria-hidden="true">←</span> 모든 시각화</a>
  <h1>MST · <span class="k">Kruskal</span> & <span class="p">Prim</span></h1>
  <div class="tab-bar">
    <button class="tab-btn active-k" id="tab-k" onclick="switchAlgo('kruskal')">KRUSKAL</button>
    <button class="tab-btn" id="tab-p" onclick="switchAlgo('prim')">PRIM</button>
  </div>
</header>

<div class="main">
  <div class="canvas-area">
    <svg id="graph" viewBox="0 0 700 400"></svg>

    <div class="legend">
      <div class="legend-item"><div class="legend-line" style="background:var(--edge-default);border:1px solid var(--node-stroke)"></div> 기본 간선</div>
      <div class="legend-item"><div class="legend-line" style="background:var(--edge-considering)"></div> 검토 중</div>
      <div class="legend-item"><div class="legend-line" style="background:var(--accent-mst)"></div> MST 포함</div>
      <div class="legend-item"><div class="legend-line" style="background:var(--edge-rejected)"></div> 사이클(제외)</div>
    </div>

    <div class="controls">
      <span class="algo-badge badge-k" id="algo-badge">KRUSKAL</span>
      <button class="btn btn-run-k" id="btn-start" onclick="startAlgo()">▶ 시작</button>
      <button class="btn btn-step" onclick="stepAlgo()">→ 단계</button>
      <button class="btn btn-auto" id="btn-auto" onclick="toggleAuto()">⚡ 자동 실행</button>
      <button class="btn btn-reset" onclick="resetAll()">↺ 초기화</button>
      <div class="speed-ctrl">
        <span>속도</span>
        <input type="range" id="speed" min="1" max="10" value="5">
      </div>
    </div>
  </div>

  <div class="sidebar">
    <div class="sidebar-section">
      <h3>현재 상태</h3>
      <div id="step-desc">알고리즘을 선택하고 시작하세요.</div>
    </div>

    <div class="sidebar-section">
      <h3 id="queue-title">간선 목록 (정렬됨)</h3>
      <div class="edge-list" id="edge-list"></div>
    </div>

    <div class="sidebar-section" id="pq-section" style="display:none">
      <h3>우선순위 큐 (Prim)</h3>
      <div class="pq-list" id="pq-list"></div>
    </div>

    <div class="sidebar-section">
      <h3>통계</h3>
      <div class="stat-grid">
        <div class="stat-box">
          <div class="val" id="stat-mst-w">0</div>
          <div class="lbl">MST 총 비용</div>
        </div>
        <div class="stat-box">
          <div class="val" id="stat-edges">0</div>
          <div class="lbl">선택된 간선</div>
        </div>
        <div class="stat-box">
          <div class="val" id="stat-step">0</div>
          <div class="lbl">단계</div>
        </div>
        <div class="stat-box">
          <div class="val" id="stat-rejected">0</div>
          <div class="lbl">제외 간선</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="../svg.js"></script>
<script>
// ─── Graph Definition ───────────────────────────────────────────────
const NODES = [
  { id: 0, x: 120, y: 80,  label: 'A' },
  { id: 1, x: 320, y: 60,  label: 'B' },
  { id: 2, x: 540, y: 90,  label: 'C' },
  { id: 3, x: 80,  y: 230, label: 'D' },
  { id: 4, x: 260, y: 200, label: 'E' },
  { id: 5, x: 450, y: 220, label: 'F' },
  { id: 6, x: 620, y: 260, label: 'G' },
  { id: 7, x: 180, y: 340, label: 'H' },
  { id: 8, x: 380, y: 350, label: 'I' },
];

const EDGES = [
  { u: 0, v: 1, w: 4 },
  { u: 0, v: 3, w: 2 },
  { u: 1, v: 2, w: 3 },
  { u: 1, v: 4, w: 5 },
  { u: 2, v: 5, w: 6 },
  { u: 2, v: 6, w: 7 },
  { u: 3, v: 4, w: 3 },
  { u: 3, v: 7, w: 8 },
  { u: 4, v: 5, w: 4 },
  { u: 4, v: 7, w: 2 },
  { u: 4, v: 8, w: 6 },
  { u: 5, v: 6, w: 3 },
  { u: 5, v: 8, w: 5 },
  { u: 6, v: 8, w: 4 },  // extra
  { u: 7, v: 8, w: 7 },
];

// ─── State ──────────────────────────────────────────────────────────
let currentAlgo = 'kruskal';
let steps = [];
let stepIdx = 0;
let autoTimer = null;
const THEME = {
  edgeDefault: '#B8B8B2',
  edgeConsidering: '#9A6A28',
  edgeRejected: '#B94A48',
  edgeMst: '#2E7D5B',
  nodeFill: '#FFFFFF',
  nodeStroke: '#C8C8C1',
  kruskal: '#376CA8',
  prim: '#8A5D9F',
  labelBg: '#FFFFFF',
  textMuted: '#666661'
};

// ─── DSU (for Kruskal) ──────────────────────────────────────────────
class DSU {
  constructor(n) { this.p = [...Array(n).keys()]; this.r = Array(n).fill(0); }
  find(x) { if (this.p[x] !== x) this.p[x] = this.find(this.p[x]); return this.p[x]; }
  union(x, y) {
    let px = this.find(x), py = this.find(y);
    if (px === py) return false;
    if (this.r[px] < this.r[py]) [px, py] = [py, px];
    this.p[py] = px;
    if (this.r[px] === this.r[py]) this.r[px]++;
    return true;
  }
}

// ─── Algorithm Builders ─────────────────────────────────────────────
function buildKruskalSteps() {
  const sorted = [...EDGES].sort((a, b) => a.w - b.w);
  const dsu = new DSU(NODES.length);
  const result = [];
  let mstW = 0, mstEdges = [], rejectedEdges = [];

  function snapshot(desc, considering = null) {
    result.push({desc, considering, mstEdges: [...mstEdges], rejectedEdges: [...rejectedEdges], mstW, sortedEdges: sorted});
  }
  snapshot(`<b>Kruskal</b>: 모든 간선을 가중치 오름차순으로 정렬합니다.<br>총 ${sorted.length}개 간선: ${sorted.map(e=>`${NODES[e.u].label}-${NODES[e.v].label}(${e.w})`).join(', ')}`);

  for (const e of sorted) {
    const canUnion = dsu.union(e.u, e.v);

    if (canUnion) {
      mstEdges.push(e);
      mstW += e.w;
    } else {
      rejectedEdges.push(e);
    }
    const label = `간선 <b>${NODES[e.u].label}-${NODES[e.v].label}</b> (가중치 ${e.w})`;
    snapshot(canUnion
      ? `${label} ✅ <br>사이클 없음 → MST에 추가! (현재 비용: ${mstW})`
      : `${label} ❌ <br>사이클 형성 → 제외`, e);

    if (mstEdges.length === NODES.length - 1) {
      snapshot(`🎉 완료! MST 구성 완료.<br>총 비용: <b>${mstW}</b> | 간선 수: ${mstEdges.length}`);
      break;
    }
  }
  return result;
}

function buildPrimSteps() {
  const n = NODES.length;
  const adj = Array.from({length: n}, () => []);
  EDGES.forEach(e => {
    adj[e.u].push({to: e.v, w: e.w, edge: e});
    adj[e.v].push({to: e.u, w: e.w, edge: e});
  });

  const result = [];
  const inMST = Array(n).fill(false);
  const mstEdges = [];
  let mstW = 0;
  let pq = []; // {w, u, v, edge}
  const rejectedEdges = [];

  function snapshot(desc, considering = null) {
    result.push({desc, considering, mstEdges: [...mstEdges], rejectedEdges: [...rejectedEdges], mstW, inMST: [...inMST], pq: [...pq]});
  }

  const startNode = 0;
  inMST[startNode] = true;

  function queueNeighbors(u) {
    for (const {to: v, w, edge} of adj[u]) {
      if (!inMST[v]) pq.push({w, u, v, edge});
    }
    pq.sort((a, b) => a.w - b.w);
  }
  queueNeighbors(startNode);

  snapshot(`<b>Prim</b>: 노드 <b>${NODES[startNode].label}</b>에서 시작.<br>인접 간선을 우선순위 큐에 추가합니다.`);

  while (pq.length > 0 && mstEdges.length < n - 1) {
    const {w, u, v, edge} = pq.shift();

    if (inMST[v]) {
      rejectedEdges.push(edge);
      snapshot(`간선 <b>${NODES[u].label}-${NODES[v].label}</b> (가중치 ${w}) ❌ <br>노드 ${NODES[v].label}이미 MST에 포함 → 제외`, edge);
      continue;
    }

    inMST[v] = true;
    mstEdges.push(edge);
    mstW += w;

    queueNeighbors(v);

    snapshot(`간선 <b>${NODES[u].label}-${NODES[v].label}</b> (가중치 ${w}) ✅ <br>노드 ${NODES[v].label} MST에 추가! (현재 비용: ${mstW})`, edge);
  }

  pq = [];
  snapshot(`🎉 완료! Prim MST 구성 완료.<br>총 비용: <b>${mstW}</b> | 간선 수: ${mstEdges.length}`);

  return result;
}

// ─── Rendering ──────────────────────────────────────────────────────
function renderGraph(state) {
  const svg = document.getElementById('graph');
  svg.replaceChildren();

  EDGES.forEach(e => {
    const n1 = NODES[e.u], n2 = NODES[e.v];
    const coords = {x1: n1.x, y1: n1.y, x2: n2.x, y2: n2.y};
    if (state.mstEdges.includes(e)) {
      svg.appendChild(svgElement('line', {...coords, stroke: THEME.edgeMst,
        'stroke-width': 8, 'stroke-opacity': 0.16, 'stroke-linecap': 'round'}));
    }
    const appearance = state.considering === e
      ? {stroke: THEME.edgeConsidering, 'stroke-width': 3, 'stroke-dasharray': '6,3'}
      : state.mstEdges.includes(e)
        ? {stroke: THEME.edgeMst, 'stroke-width': 3}
        : state.rejectedEdges.includes(e)
          ? {stroke: THEME.edgeRejected, 'stroke-width': 1.5, 'stroke-opacity': 0.4, 'stroke-dasharray': '3,4'}
          : {stroke: THEME.edgeDefault, 'stroke-width': 1.5};
    svg.appendChild(svgElement('line', {...coords, 'stroke-linecap': 'round', ...appearance}));

    const mx = (n1.x + n2.x) / 2, my = (n1.y + n2.y) / 2;
    svg.appendChild(svgElement('rect', {x: mx - 9, y: my - 9, width: 18, height: 14,
      rx: 3, fill: THEME.labelBg, opacity: 0.92}));
    svg.appendChild(svgElement('text', {x: mx, y: my + 2, 'text-anchor': 'middle',
      'font-size': 10, 'font-family': 'Space Mono, monospace',
      fill: state.considering === e ? THEME.edgeConsidering : state.mstEdges.includes(e) ? THEME.edgeMst : THEME.textMuted}, e.w));
  });

  NODES.forEach(n => {
    const inMST = state.inMST?.[n.id];
    const color = currentAlgo === 'prim' ? THEME.prim : THEME.kruskal;
    if (inMST) {
      svg.appendChild(svgElement('circle', {cx: n.x, cy: n.y, r: 22,
        fill: currentAlgo === 'prim' ? '#F6F3FA' : '#F2F6FC'}));
    }
    svg.appendChild(svgElement('circle', {cx: n.x, cy: n.y, r: 16, fill: THEME.nodeFill,
      stroke: inMST ? color : THEME.nodeStroke, 'stroke-width': inMST ? 2.5 : 1.5}));
    svg.appendChild(svgElement('text', {x: n.x, y: n.y + 5, 'text-anchor': 'middle',
      'font-size': 13, 'font-weight': 'bold', 'font-family': 'Space Mono, monospace',
      fill: inMST ? color : THEME.textMuted}, n.label));
  });
}

function renderSidebar(state) {
  document.getElementById('step-desc').innerHTML = state.desc;
  document.getElementById('stat-mst-w').textContent = state.mstW;
  document.getElementById('stat-edges').textContent = state.mstEdges.length;
  document.getElementById('stat-step').textContent = stepIdx;
  document.getElementById('stat-rejected').textContent = state.rejectedEdges.length;

  // Edge list
  const el = document.getElementById('edge-list');
  el.innerHTML = '';

  if (currentAlgo === 'kruskal') {
    state.sortedEdges.forEach(e => {
      const status = state.considering === e ? 'considering' : state.mstEdges.includes(e) ? 'accepted' : state.rejectedEdges.includes(e) ? 'rejected' : '';
      el.appendChild(edgeItem(e, status));
    });

    document.getElementById('queue-title').textContent = '간선 목록 (가중치 정렬)';
    document.getElementById('pq-section').style.display = 'none';
  } else {
    // Show MST edges
    document.getElementById('queue-title').textContent = 'MST 간선';
    state.mstEdges.forEach(e => el.appendChild(edgeItem(e, 'accepted')));

    // PQ
    document.getElementById('pq-section').style.display = 'block';
    const pqEl = document.getElementById('pq-list');
    pqEl.innerHTML = '';
    if (state.pq.length) {
      state.pq.forEach((item, i) => {
        const div = document.createElement('div');
        div.className = 'pq-item' + (i === 0 ? ' top' : '');
        div.innerHTML = `<span>${NODES[item.u].label}→${NODES[item.v].label}</span><span>${item.w}</span>`;
        pqEl.appendChild(div);
      });
    } else {
      pqEl.innerHTML = '<div style="color:var(--text-muted);font-size:0.72rem;padding:8px">비어 있음</div>';
    }
  }
}

// ─── Helpers ────────────────────────────────────────────────────────
function edgeItem(e, status) {
  const div = document.createElement('div');
  div.className = 'edge-item' + (status ? ' ' + status : '');
  const color = {considering: THEME.edgeConsidering, accepted: THEME.edgeMst, rejected: THEME.edgeRejected}[status] || THEME.nodeStroke;
  div.innerHTML = `<div class="dot" style="background:${color}"></div>${NODES[e.u].label}—${NODES[e.v].label} &nbsp;<span style="color:var(--edge-considering)">${e.w}</span>`;
  return div;
}

function emptyState() {
  return { desc: '알고리즘을 선택하고 시작하세요.', mstEdges: [], rejectedEdges: [], considering: null, mstW: 0, inMST: Array(NODES.length).fill(false), pq: [], sortedEdges: [] };
}

// ─── Controls ───────────────────────────────────────────────────────
function switchAlgo(algo) {
  currentAlgo = algo;
  resetAll();

  document.getElementById('tab-k').className = 'tab-btn' + (algo === 'kruskal' ? ' active-k' : '');
  document.getElementById('tab-p').className = 'tab-btn' + (algo === 'prim' ? ' active-p' : '');
  document.getElementById('algo-badge').textContent = algo.toUpperCase();
  document.getElementById('algo-badge').className = 'algo-badge ' + (algo === 'kruskal' ? 'badge-k' : 'badge-p');
  document.getElementById('btn-start').className = 'btn ' + (algo === 'kruskal' ? 'btn-run-k' : 'btn-run-p');
}

function startAlgo() {
  stopAuto();
  steps = currentAlgo === 'kruskal' ? buildKruskalSteps() : buildPrimSteps();
  stepIdx = 0;
  applyStep();
}

function stepAlgo() {
  if (!steps.length) startAlgo();
  else if (stepIdx < steps.length - 1) { stepIdx++; applyStep(); }
}

function applyStep() {
  if (stepIdx >= steps.length) return;
  const s = steps[stepIdx];
  renderGraph(s);
  renderSidebar(s);
}

function toggleAuto() {
  if (autoTimer) { stopAuto(); return; }
  if (!steps.length) startAlgo();
  const btn = document.getElementById('btn-auto');
  btn.textContent = '⏸ 정지';
  const speed = document.getElementById('speed').value;
  const delay = Math.round(1200 / speed);
  autoTimer = setInterval(() => {
    if (stepIdx < steps.length - 1) stepAlgo();
    else stopAuto();
  }, delay);
}

function stopAuto() {
  clearInterval(autoTimer);
  autoTimer = null;
  document.getElementById('btn-auto').textContent = '⚡ 자동 실행';
}

function resetAll() {
  stopAuto();
  steps = [];
  stepIdx = 0;
  const s = emptyState();
  renderGraph(s);
  renderSidebar(s);
}

// ─── Init ────────────────────────────────────────────────────────────
resetAll();
</script>
</body>
</html>
